name: P0-C PostgreSQL Sales Persistence Validation
on:
  push:
    paths:
      - 'docs/05-data/migrations/postgresql/003_sales_vertical_slice.sql'
      - 'src/infrastructure/sql/postgres-sales-persistence.ts'
      - 'src/persistence/sales-contracts.ts'
      - 'tests/p0-c-postgres-sales-persistence.test.mjs'
      - '.github/workflows/p0-c-postgres-sales-validation.yml'
  pull_request:
    paths:
      - 'docs/05-data/migrations/postgresql/003_sales_vertical_slice.sql'
      - 'src/infrastructure/sql/postgres-sales-persistence.ts'
      - 'src/persistence/sales-contracts.ts'
      - 'tests/p0-c-postgres-sales-persistence.test.mjs'
      - '.github/workflows/p0-c-postgres-sales-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pharmatech_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmatech_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Apply foundational migration
        env: { PGPASSWORD: postgres }
        run: psql -h 127.0.0.1 -U postgres -d pharmatech_test -f docs/05-data/migrations/postgresql/001_p0_4_foundation.sql
      - name: Apply sales migration
        env: { PGPASSWORD: postgres }
        run: psql -h 127.0.0.1 -U postgres -d pharmatech_test -f docs/05-data/migrations/postgresql/003_sales_vertical_slice.sql
      - name: Validate PostgreSQL sales persistence
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pharmatech_test
          POSTGRES_REQUIRED: "true"
        run: node --test tests/p0-c-postgres-sales-persistence.test.mjs
